<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>準備中！</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    .message {
      font-size: 2em;
      color: #0077cc;
      margin-bottom: 40px;
    }
    .close-btn {
      font-size: 1em;
      padding: 10px 20px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .close-btn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
  <div class="message">準備中！</div>
  <button onclick="history.back()">戻る</button>
</body>
</html>
