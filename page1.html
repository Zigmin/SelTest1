<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>クイズアプリ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .choice { margin: 5px 0; display: block; }
    .result, .explanation { margin-top: 20px; white-space: pre-wrap; }
    button { margin-top: 10px; font-size: 18px; padding: 10px 20px;}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <h2 id="question">読み込み中...</h2>
  <form id="choices"></form>
  <button onclick="checkAnswer()">解答確認</button>
  <div class="result" id="result"></div>
  <div class="explanation" id="explanation"></div>
  <button onclick="prevQuestion()">前の問題へ</button>
  <button onclick="nextQuestion()">次の問題へ</button>

  <hr>
  <label>パスフレーズを入力：</label>
  <input type="password" id="keyInput">
  <button onclick="loadAndDecrypt()">クイズ読み込み</button>

  <script>
    let quizData = [];
    let currentIndex = 0;
    let selected = null;
    let correctCount = 0;

    async function loadAndDecrypt() {
      const passphrase = document.getElementById("keyInput").value;
      const res = await fetch("quiz_data.json");
      const encryptedJson = await res.json();
      quizData = decryptStrings(encryptedJson, passphrase);
      currentIndex = 0;
      correctCount = 0;
      selected = null;
      renderQuestion();
    }

    function decryptStrings(obj, passphrase) {
      if (typeof obj === "string") {
        try {
          const bytes = CryptoJS.AES.decrypt(obj, passphrase);
          return bytes.toString(CryptoJS.enc.Utf8) || obj;
        } catch {
          return obj;
        }
      } else if (Array.isArray(obj)) {
        return obj.map(item => decryptStrings(item, passphrase));
      } else if (typeof obj === "object" && obj !== null) {
        const result = {};
        for (const key in obj) {
          result[key] = decryptStrings(obj[key], passphrase);
        }
        return result;
      } else {
        return obj;
      }
    }

    function renderQuestion() {
      const quiz = quizData[currentIndex];
      document.getElementById('question').textContent = quiz.question;
      const choicesForm = document.getElementById('choices');
      choicesForm.innerHTML = '';
      quiz.choices.forEach((choice, index) => {
        const label = document.createElement('label');
        label.className = 'choice';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'choice';
        radio.value = index + 1;
        radio.onclick = () => selected = index + 1;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(`${index + 1}. ${choice}`));
        choicesForm.appendChild(label);
      });
      document.getElementById('result').textContent = '';
      document.getElementById('explanation').textContent = '';
    }

    function checkAnswer() {
      const quiz = quizData[currentIndex];
      const result = document.getElementById('result');
      const explanation = document.getElementById('explanation');

      if (selected === quiz.answer) {
        result.textContent = `正解は ${quiz.answer} 番です。正解です！`;
        correctCount++;
      } else {
        result.textContent = `正解は ${quiz.answer} 番です。不正解です。`;
      }

      result.textContent += `　${correctCount}問正解 ／ 全${quizData.length}問`;
      explanation.textContent = quiz.explanations.join('\n');
    }

    function nextQuestion() {
      currentIndex++;
      selected = null;
      if (currentIndex < quizData.length) {
        renderQuestion();
      } else {
        document.getElementById('question').textContent = 'すべての問題が終了しました。';
        document.getElementById('choices').innerHTML = '';
        document.getElementById('result').textContent = `最終結果：${correctCount}問正解 ／ 全${quizData.length}問`;
        document.getElementById('explanation').textContent = '';
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        selected = null;
        renderQuestion();
      }
    }
  </script>
</body>
</html>
